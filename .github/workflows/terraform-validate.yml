name: terraform-validate
on:
  pull_request:
    paths: ["deployment/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy: { matrix: { cloud: [aws, azure, gcp] } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=deployment/${{ matrix.cloud }} init -backend=false
      - run: terraform -chdir=deployment/${{ matrix.cloud }} validate
